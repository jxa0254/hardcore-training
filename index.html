<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hybrid Arena">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Hybrid Arena has moved</title>
<style>
  :root { --bg:#0b0b0d; --panel:#17171b; --line:#2b2b31; --text:#f5f5f0; --muted:#9a9aa2; --accent:#ff3b30; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",system-ui,Roboto,Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; padding-top:calc(24px + env(safe-area-inset-top)); }
  .card { max-width:420px; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { margin:0 0 6px; font-size:22px; font-weight:900; letter-spacing:1px; text-transform:uppercase; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); line-height:1.5; margin:10px 0; }
  ol { color:var(--text); line-height:1.6; padding-left:20px; margin:10px 0 18px; }
  a.go { display:block; text-align:center; background:var(--accent); color:#fff; font-weight:800; text-decoration:none; padding:14px; border-radius:12px; letter-spacing:.5px; }
  .count { color:var(--text); font-weight:700; }
</style>
</head>
<body>
<div class="card" id="card" hidden>
  <h1><span>Hybrid</span>Arena has moved</h1>
  <p>Same app, new home. Taking you there in <span class="count" id="count">8</span> seconds.</p>
  <p>If you saved the old one to your home screen, please swap it for the new one:</p>
  <ol>
    <li>On the new page, tap the Share button in Safari</li>
    <li>Tap <strong>Add to Home Screen</strong></li>
    <li>Delete the old icon</li>
  </ol>
  <a class="go" id="go" href="#">Go to the new Hybrid Arena</a>
</div>
<noscript><p style="text-align:center">Hybrid Arena has moved. <a style="color:#ff3b30" href="https://hybridarena.co.uk/">Open the new site</a></p></noscript>
<script>
  // The one line to change if the new address ever changes.
  var NEW_BASE = 'https://hybridarena.co.uk';

  // Map the old page names to the new paths, and keep any ?w= / #id link.
  var page = location.pathname.split('/').pop().replace('.html', '');
  var target = NEW_BASE + (page === 'admin' ? '/admin' : '/') + location.search + location.hash;
  document.getElementById('go').href = target;

  var SEEN = 'hybridArena.movedNoticeSeen';
  var seen = false;
  try { seen = localStorage.getItem(SEEN) === '1'; } catch (e) {}

  if (seen || page === 'admin' || page === 'stats') {
    location.replace(target);
  } else {
    try { localStorage.setItem(SEEN, '1'); } catch (e) {}
    document.getElementById('card').hidden = false;
    var n = 8;
    var t = setInterval(function () {
      n -= 1;
      document.getElementById('count').textContent = n;
      if (n <= 0) { clearInterval(t); location.replace(target); }
    }, 1000);
  }
</script>
</body>
</html>
