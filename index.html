<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Hybrid Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
    <h1><span>Hybrid</span>Arena</h1>
    <div class="btn-row">
        <button class="navlink" id="btnWake" title="Keep screen on">🔆</button>
        <button class="navlink" id="btnRefresh" title="Refresh (get the latest published workouts)">🔄</button>
    </div>
</header>

<main>

    <section id="homeView">
        <div class="workout-picker" id="workoutList"></div>
        <div class="empty-hint" id="emptyHint" hidden>
            No workouts saved yet. Head to <a href="admin.html">Admin</a> to load some in.
        </div>
    </section>

    <section id="boardView" hidden>
        <div class="board-wrap" id="boardWrap">
            <div class="board" id="board"></div>
        </div>

        <div class="board-actions">
            <div class="btn-row">
                <button class="btn ghost block" id="btnHome">Back to Home Page</button>
            </div>
        </div>
    </section>

    <div class="settings-row">
        <a href="admin.html" class="settings-cog" title="Admin">⚙️</a>
    </div>

</main>


<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
