<!--
    Bump the ?v= on style.css/store.js/app.js below whenever those files
    change - GitHub Pages/browsers cache them independently of this HTML
    file, so without a version bump a stale copy can keep being served
    even after a fresh deploy (this bit us once already - see commit
    history around "cache-busting").
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Hybrid Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>

<header class="top">
    <h1><span>Hybrid</span>Arena</h1>
    <div class="btn-row">
        <button class="navlink" id="btnHome" title="Home">🏠</button>
        <button class="navlink" id="btnWake" title="Keep screen on">🔆</button>
        <button class="navlink" id="btnRefresh" title="Refresh (get the latest published workouts)">🔄</button>
    </div>
</header>

<main>

    <section id="homeView">
        <div class="workout-picker" id="workoutList"></div>
        <div class="empty-hint" id="emptyHint" hidden></div>

        <div class="btn-row" style="margin-top:16px;">
            <button class="btn primary block" id="btnRandomize">🎲 Randomize</button>
        </div>

        <div class="settings-row">
            <a href="admin.html" id="linkAdmin" class="settings-cog" title="Admin">⚙️</a>
        </div>
    </section>

    <div class="modal-overlay" id="randomizeModal" hidden>
        <div class="modal-card">
            <p class="modal-title">Pick a Level</p>
            <div class="modal-btns">
                <button class="btn block rank-btn-Tough" data-level="Tough">Tough</button>
                <button class="btn block rank-btn-Hardcore" data-level="Hardcore">Hardcore</button>
                <button class="btn block rank-btn-Extreme" data-level="Extreme">Extreme</button>
            </div>
            <button class="btn ghost block" id="btnRandomizeAny" style="margin-top:10px;">Skip — Surprise Me</button>
            <button class="btn ghost block" id="btnRandomizeCancel" style="margin-top:10px;">Cancel</button>
        </div>
    </div>

    <section id="boardView" hidden>
        <div class="board-nav-wrap" id="boardNavWrap">
            <div class="board-wrap" id="boardWrap">
                <div class="board" id="board"></div>
            </div>
        </div>
        <div class="board-actions">
            <div class="rate-row" id="rateRow"></div>
        </div>

        <div class="board-swipe-hint">⟷ Swipe left or right to browse other workouts</div>
    </section>

</main>


<script src="store.js?v=20"></script>
<script src="ratings.js?v=20"></script>
<script src="app.js?v=20"></script>
</body>
</html>
