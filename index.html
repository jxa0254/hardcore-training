<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Hybrid Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
    <h1><span>Hybrid</span>Arena</h1>
    <div class="btn-row">
        <button class="navlink" id="btnRefresh" title="Refresh (get the latest published workouts)">🔄</button>
        <a class="navlink" href="admin.html">Admin</a>
    </div>
</header>

<main>

    <section id="pickView">
        <div class="rank-grid" id="rankGrid"></div>
        <div class="empty-hint" id="emptyHint" hidden>
            No workouts saved yet. Head to <a href="admin.html">Admin</a> to load some in and rank them.
        </div>
    </section>

    <section id="listView" hidden>
        <div class="btn-row">
            <button class="btn ghost block" id="btnBackToRanks">⬅ Change Rank</button>
        </div>
        <div class="workout-picker" id="workoutPicker"></div>
    </section>

    <section id="boardView" hidden>
        <div class="board-wrap" id="boardWrap">
            <div class="board" id="board"></div>
        </div>

        <div class="board-actions">
            <label class="wake-row" for="wakeToggle">
                <span class="switch">
                    <input type="checkbox" id="wakeToggle">
                    <span class="slider"></span>
                </span>
                Keep screen on
            </label>
            <div class="btn-row">
                <button class="btn ghost block" id="btnHome">Back to Home Page</button>
            </div>
        </div>
    </section>

</main>


<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
